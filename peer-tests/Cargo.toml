[package]
name = "peer-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
peer = { path = "../peer" }
mtrxai-attestation = { path = "../../common/mtrxai-attestation" }
axum = "0.7"
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
uuid = { version = "1.23.3", features = ["v4"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
