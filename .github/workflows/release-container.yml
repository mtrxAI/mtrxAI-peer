name: Release Container

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (defaults to release.toml, e.g. 0.1.5)
        required: false
        type: string
      push_docker:
        description: Push attested images to Docker Hub (mtrxai/mtrx-peer)
        type: boolean
        default: true
      common_ref:
        description: mtrxAI-common git ref (branch, tag, or SHA). Example version/0.4.0. Empty uses the repo variable MTRXAI_COMMON_REF, then this workflow branch.
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: peer-release-container-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mtrxAI-peer
    outputs:
      version: ${{ steps.meta.outputs.version }}
      client_image: ${{ steps.meta.outputs.client_image }}
      common_ref: ${{ steps.meta.outputs.common_ref }}
    steps:
      - name: Checkout peer
        uses: actions/checkout@v4
        with:
          path: mtrxAI-peer

      - name: Resolve and sync version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMON_REF: ${{ inputs.common_ref }}
          VAR_COMMON_REF: ${{ vars.MTRXAI_COMMON_REF }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VER="${INPUT_VERSION#v}"
          else
            VER="$(python3 scripts/sync_release_version.py get-version)"
          fi
          python3 scripts/sync_release_version.py sync "${VER}"
          eval "$(python3 scripts/sync_release_version.py print-env | sed 's/^/export /')"
          if [[ -n "${INPUT_COMMON_REF}" ]]; then
            COMMON_REF="${INPUT_COMMON_REF}"
          elif [[ -n "${VAR_COMMON_REF}" ]]; then
            COMMON_REF="${VAR_COMMON_REF}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            COMMON_REF="version/${VER}"
          else
            COMMON_REF="${GITHUB_REF_NAME}"
          fi
          {
            echo "version=${MTRXAI_VERSION}"
            echo "client_image=${MTRXAI_DOCKER_CLIENT_IMAGE}"
            echo "common_ref=${COMMON_REF}"
          } >> "${GITHUB_OUTPUT}"
          echo "Release version: ${MTRXAI_VERSION}"
          echo "Image: ${MTRXAI_DOCKER_CLIENT_IMAGE}"
          echo "mtrxAI-common ref: ${COMMON_REF}"

  docker:
    name: Docker linux/${{ matrix.arch }}
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: mtrxAI-peer
    strategy:
      fail-fast: false
      matrix:
        include:
          # platform must match peer proof (Rust OS/ARCH), not Docker GOARCH labels
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/aarch64
    env:
      MTRXAI_VERSION: ${{ needs.resolve-version.outputs.version }}
      MTRXAI_DOCKER_CLIENT_IMAGE: ${{ needs.resolve-version.outputs.client_image }}
      MTRXAI_BUILD_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout peer
        uses: actions/checkout@v4
        with:
          path: mtrxAI-peer

      - name: Checkout common
        uses: actions/checkout@v4
        with:
          repository: ${{ format('{0}/mtrxAI-common', github.repository_owner) }}
          path: mtrxAI-common
          ref: ${{ needs.resolve-version.outputs.common_ref }}
          token: ${{ secrets.MTRXAI_COMMON_READ_TOKEN || github.token }}

      - name: Sync package version
        run: python3 scripts/sync_release_version.py sync "${MTRXAI_VERSION}"

      - name: Generate attestation credentials
        run: |
          echo "MTRXAI_BUILD_ID=$(uuidgen)" >> "$GITHUB_ENV"
          echo "MTRXAI_ATTESTATION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build attested peer image
        env:
          MTRXAI_FORCE_NEW_BUILD: "1"
        working-directory: mtrxAI-peer
        run: |
          chmod +x scripts/build-client-docker-attestation.sh scripts/write-allowed-build-manifest.sh
          LOCAL_TAG="mtrx-peer:${MTRXAI_VERSION}-${{ matrix.arch }}"
          scripts/build-client-docker-attestation.sh "${LOCAL_TAG}" release/docker
          echo "LOCAL_CLIENT_IMAGE=${LOCAL_TAG}" >> "$GITHUB_ENV"

      - name: Verify attestation manifest
        run: |
          set -euo pipefail
          EXPECTED="$(python3 -c 'import json; print(json.load(open("release/docker/allowed_build.json"))["binary_sha256"])')"
          ACTUAL="$(sha256sum release/docker/client | awk '{print $1}')"
          if [[ "${EXPECTED}" != "${ACTUAL}" ]]; then
            echo "::error::allowed_build.json hash ${EXPECTED} != image binary ${ACTUAL}" >&2
            exit 1
          fi
          BUILD_ID="$(python3 -c 'import json; print(json.load(open("release/docker/allowed_build.json"))["build_id"])')"
          echo "Docker ${{ matrix.arch }} attested: build_id=${BUILD_ID} sha=${ACTUAL:0:16}..."
          echo "BUILD_ID=${BUILD_ID}" >> "$GITHUB_ENV"

      - name: Save Docker image tarball
        run: docker save "${LOCAL_CLIENT_IMAGE}" | gzip > "release/docker/mtrx-peer-image-${{ matrix.arch }}.tar.gz"

      - name: Push arch image to Docker Hub
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.push_docker)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN required to push" >&2
            exit 1
          fi
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          REMOTE="${MTRXAI_DOCKER_CLIENT_IMAGE}"
          ARCH_TAG="${MTRXAI_VERSION}-${{ matrix.arch }}"
          docker tag "${LOCAL_CLIENT_IMAGE}" "${REMOTE}:${ARCH_TAG}"
          docker push "${REMOTE}:${ARCH_TAG}"
          echo "Pushed ${REMOTE}:${ARCH_TAG} build_id=${BUILD_ID}"

      - uses: actions/upload-artifact@v4
        with:
          name: attestation-docker-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            mtrxAI-peer/release/docker/client
            mtrxAI-peer/release/docker/allowed_build.json
            mtrxAI-peer/release/docker/allowed_build.credentials.env
            mtrxAI-peer/release/docker/mtrx-peer-image-${{ matrix.arch }}.tar.gz

  docker-manifest:
    name: Docker multi-arch manifest
    needs: [resolve-version, docker]
    if: >-
      always() &&
      !cancelled() &&
      needs.docker.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.push_docker)
      )
    runs-on: ubuntu-latest
    env:
      MTRXAI_VERSION: ${{ needs.resolve-version.outputs.version }}
      MTRXAI_DOCKER_CLIENT_IMAGE: ${{ needs.resolve-version.outputs.client_image }}
    steps:
      - name: Create and push manifest list
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::Docker Hub credentials required" >&2
            exit 1
          fi
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          REMOTE="${MTRXAI_DOCKER_CLIENT_IMAGE}"
          docker buildx imagetools create \
            -t "${REMOTE}:${MTRXAI_VERSION}" \
            -t "${REMOTE}:latest" \
            "${REMOTE}:${MTRXAI_VERSION}-amd64" \
            "${REMOTE}:${MTRXAI_VERSION}-arm64"
          echo "Published multi-arch ${REMOTE}:${MTRXAI_VERSION} and :latest"

  dispatch-attestation:
    name: Publish attestation allowlist
    needs:
      - resolve-version
      - docker
      - docker-manifest
    if: >-
      always() &&
      !cancelled() &&
      needs.docker.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch infra attestation publish
        env:
          GH_TOKEN: ${{ secrets.MTRXAI_INFRA_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::MTRXAI_INFRA_DISPATCH_TOKEN not set — builds were attested but lobby allowlist will NOT update automatically." >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${{ needs.resolve-version.outputs.version }}"
          fi
          gh api "repos/${{ github.repository_owner }}/mtrxAI-infra/dispatches" \
            -f event_type=client-release \
            -f "client_payload[tag]=${TAG}" \
            -f "client_payload[run_id]=${GITHUB_RUN_ID}" \
            -f "client_payload[app_repo]=${{ github.repository }}" \
            -f "client_payload[scope]=docker"
          echo "Dispatched attestation publish to mtrxAI-infra: tag=${TAG} run_id=${GITHUB_RUN_ID} scope=docker"

  release-summary:
    name: Release summary
    needs:
      - resolve-version
      - docker
      - docker-manifest
      - dispatch-attestation
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: attestation-docker-*
          merge-multiple: true
          path: artifacts

      - name: Write summary
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          CLIENT_IMAGE: ${{ needs.resolve-version.outputs.client_image }}
        run: |
          {
            echo "## mtrxAI peer container release v${VERSION}"
            echo ""
            echo "### Docker Hub"
            echo "- \`${CLIENT_IMAGE}:${VERSION}\` (multi-arch amd64+arm64)"
            echo "- \`${CLIENT_IMAGE}:${VERSION}-amd64\` / \`${CLIENT_IMAGE}:${VERSION}-arm64\`"
            echo ""
            echo "### Attested Docker builds"
            echo "| Target | build_id | platform | binary_sha256 |"
            echo "|--------|----------|----------|---------------|"
            if find artifacts -name 'allowed_build.json' 2>/dev/null | grep -q .; then
              while IFS= read -r manifest; do
                build_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["build_id"])' "$manifest")"
                platform="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["platform"])' "$manifest")"
                sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["binary_sha256"])' "$manifest")"
                label="$(echo "$manifest" | sed -n 's|.*/artifacts/\([^/]*\)/.*|\1|p')"
                if [[ -z "${label}" ]]; then
                  label="$(basename "$(dirname "$manifest")")"
                fi
                echo "| ${label} | \`${build_id}\` | \`${platform}\` | \`${sha:0:16}...\` |"
              done < <(find artifacts -name 'allowed_build.json' 2>/dev/null | sort)
            else
              echo "| (pending) | | | |"
            fi
            echo ""
            echo "### Attestation allowlist"
            if [[ "${{ needs.dispatch-attestation.result }}" == "success" ]]; then
              echo "Dispatched to mtrxAI-infra (run_id \`${{ github.run_id }}\`, scope=docker)"
            elif [[ "${{ needs.dispatch-attestation.result }}" == "skipped" ]]; then
              echo "_Skipped_"
            else
              echo "**Failed** — check \`MTRXAI_INFRA_DISPATCH_TOKEN\` and infra workflow"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
