name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peer
    steps:
      - name: Checkout peer
        uses: actions/checkout@v4
        with:
          path: peer

      - name: Checkout common
        uses: actions/checkout@v4
        with:
          repository: ${{ format('{0}/mtrxAI-common', github.repository_owner) }}
          path: common
          token: ${{ secrets.MTRXAI_COMMON_READ_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: peer

      - name: Unit and integration tests
        run: |
          cargo test -p peer
          cargo test -p peer-tests
