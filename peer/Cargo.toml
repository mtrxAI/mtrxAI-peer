[package]
name = "peer"
version = "0.1.5"
edition = "2021"
build = "build.rs"

[lib]
name = "peer"
path = "src/lib.rs"

[[bin]]
name = "peer"
path = "src/main.rs"

[dependencies]
mtrxai-attestation = { path = "../../mtrxAI-common/mtrxai-attestation" }
webrtc = "0.11.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
axum = { version = "0.7", features = ["query"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-stream = "0.3.6"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
sha2 = "0.10"
aes-gcm = "0.10"
getrandom = "0.2"
native_db = { version = "0.8", features = ["tokio"] }
native_model = "0.4"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
# No `quic`: libp2p 0.54's quic → rcgen 0.11 → ring 0.16 breaks Windows ARM64 builds.
libp2p = { version = "0.54", features = ["tcp", "dns", "identify", "kad", "gossipsub", "rendezvous", "autonat", "relay", "request-response", "macros", "noise", "yamux", "tokio"] }
hex = "0.4.3"
async-trait = "0.1.89"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hmac = "0.12"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }

[build-dependencies]
uuid = { version = "1.23.3", features = ["v4"] }
